[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js adapter (OpenNext). Declared explicitly because automatic detection didn't apply to this
# site (created as a CRA site). Without it .next is published as static files and every route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect .netlify.app to .com domain
[[redirects]]
  from = "https://limbus-company-id-creator.netlify.app/*"
  to = "https://limbus-company-id-creator.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-json/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/vendor/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cgi-bin/*"
  to = "/404.html"
  status = 404
  force = true

# Backward compatibility: cards saved by the old CRA app reference images with relative paths
# ("Images/...") that resolve under /creator/ (e.g. /creator/Images/status-effect/X.webp).
# Serve them from public/Images without changing the URL.
[[redirects]]
  from = "/creator/Images/*"
  to = "/Images/:splat"
  status = 200

# Proxy API requests to backend (runs at the CDN edge, not through the Next server)
[[redirects]]
  from = "/API/*"
  to = "https://relative-alexandrina-limbus-2a826726.koyeb.app/API/:splat"
  status = 200
