[build]
  command = "npm run build"
  publish = ".next"

# Redirect .netlify.app to .com domain
[[redirects]]
  from = "https://limbus-company-id-creator.netlify.app/*"
  to = "https://limbus-company-id-creator.com/:splat"
  status = 301
  force = true

# Proxy API requests to backend (runs at the CDN edge, not through the Next server)
[[redirects]]
  from = "/API/*"
  to = "https://relative-alexandrina-limbus-2a826726.koyeb.app/API/:splat"
  status = 200
