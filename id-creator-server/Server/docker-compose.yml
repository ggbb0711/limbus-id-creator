version: "3.4"

services:
  
  rabbitmq:
    image: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "5672" ]
      interval: 5s
      timeout: 15s
      retries: 1

  webapi:
    image: server/server:latest
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8000:8080"
    depends_on:
      - rabbitmq
    #   - postgres
    restart: on-failure
    environment:
      - JWTSecret=${JWTSecret}
      - TokenEndpoint=${TokenEndpoint}
      - SessionExpiredDay=${SessionExpiredDay}
      - DefaultConnection=${DefaultConnection}
      - RemoteConnection=${RemoteConnection}
      - FrontendUri=${FrontendUri}
      - CookieSessionProtectorSecret=${CookieSessionProtectorSecret}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_HOST_USER_NAME=${RABBITMQ_HOST_USER_NAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VH=${RABBITMQ_VH}
      - RABBITMQ_REQUESTED_HEARTBEAT=${RABBITMQ_REQUESTED_HEARTBEAT}
      - MODE=${MODE}
      - LISTEN_ON=${LISTEN_ON}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}